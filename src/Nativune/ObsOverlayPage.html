<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Nativune now playing</title>
<style>
  /* The pill consumes the look's custom properties; every fallback below is the plain link's frozen value
     (440 x 96 source, 400 x 56 pill at 20,20, r 28, centred Segoe UI text), so the plain page renders as before. */
  html, body { margin: 0; width: var(--sw, 440px); height: var(--sh, 96px); overflow: hidden; background: transparent; }
  html[data-preview="1"], html[data-preview="1"] body { overflow: auto; }
  #backdrop { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
  html[data-preview="1"] #backdrop {
    display: block;
    background: linear-gradient(45deg, #bdbdbd 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(-45deg, #bdbdbd 25%, transparent 25%) 0 8px / 16px 16px,
      linear-gradient(45deg, transparent 75%, #bdbdbd 75%) 8px -8px / 16px 16px,
      linear-gradient(-45deg, transparent 75%, #bdbdbd 75%) -8px 0 / 16px 16px,
      #e6e6e6;
  }
  html[data-backdrop="dark"] #backdrop { background: #202020; }
  html[data-backdrop="light"] #backdrop { background: #e8e8e8; }
  html[data-backdrop="custom"] #backdrop { background: var(--backdrop, #202020); }
  #pill {
    position: absolute; left: 20px; top: 20px; width: var(--w, 400px); height: calc(56px * var(--k, 1));
    border-radius: calc(28px * var(--k, 1)); overflow: hidden; background: #202020;
    box-shadow: 6px 8px 14px rgba(0, 0, 0, .65);
    opacity: 0; transform: translateY(12px);
    color: var(--fg, #fff); text-align: var(--align, center);
    font-family: var(--font, "Segoe UI Variable Text", "Segoe UI", sans-serif);
    text-shadow: var(--shadow, 0 1px 3px rgba(0, 0, 0, .8));
  }
  #pill canvas { position: absolute; left: 0; top: 0; width: var(--w, 400px); height: calc(56px * var(--k, 1)); }
  #clip {
    position: absolute; left: 0; top: 0; width: var(--w, 400px); height: calc(56px * var(--k, 1));
    overflow: hidden; transform: translateX(100%);
  }
  #text {
    position: absolute; left: calc(28px * var(--k, 1)); right: calc(28px * var(--k, 1)); top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  #title, #artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  #title { font-size: calc(18px * var(--k, 1)); font-weight: 700; }
  #artist { font-size: calc(15px * var(--k, 1)); font-weight: 400; }
  #artist:empty { display: none; }
  html[data-show-artist="false"] #artist { display: none; }
  /* Shared slots stay out of the compatibility pill's flow and paint. */
  #panel, #cover, #bottom, #stripe, #status, #scrim { display: none; }
  #bar { position: relative; min-width: 0; }
  #barclip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }
  #barfill { width: 100%; height: 100%; background: var(--accent, #8a8a95); transform: translateX(-100%); }
  #barhead { display: none; position: absolute; left: calc(-4px * var(--k)); top: calc(-2px * var(--k)); width: calc(8px * var(--k)); height: calc(8px * var(--k)); border-radius: 50%; background: var(--fg, #fff); }
  #thumb { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  #noart { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: rgba(255,255,255,.4); }
  #noart svg { width: calc(32px * var(--k)); height: calc(32px * var(--k)); }
  html[data-art="true"] #thumb { display: block; }
  html[data-art="true"] #noart { display: none; }
  #elapsed, #duration { font-size: calc(13px * var(--k)); font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font), Consolas, sans-serif; opacity: .85; white-space: nowrap; }
  #elapsed { text-align: right; }
  #duration { text-align: left; }
  #status { position: absolute; left: var(--status-x); top: var(--status-y); width: calc(12px * var(--k)); height: calc(12px * var(--k)); }
  html[data-state="paused"][data-has-time="true"] #elapsed { opacity: 0; }
  html[data-state="paused"][data-has-time="true"] #status { display: block; }

  /* Horizontal themes use the same fixed cover/column/time reservations at every width and scale. */
  html[data-layout="horizontal"] #pill { display: flex; align-items: center; height: calc(80px * var(--k)); border-radius: calc(14px * var(--k)); background: transparent; }
  html[data-layout="horizontal"] #panel { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--bg); opacity: var(--bg-a); border-radius: inherit; }
  html[data-layout="horizontal"] #colour { width: 100%; height: 100%; }
  html[data-layout="horizontal"] #clip { display: none; }
  html[data-layout="horizontal"] #cover { display: block; position: relative; flex: 0 0 calc(64px * var(--k)); width: calc(64px * var(--k)); height: calc(64px * var(--k)); margin: 0 calc(12px * var(--k)) 0 calc(8px * var(--k)); border-radius: calc(8px * var(--k)); overflow: hidden; background: #2a2a2e; }
  html[data-layout="horizontal"] #column { position: relative; flex: 1; min-width: 0; height: calc(80px * var(--k)); margin: 0 calc(12px * var(--k)) 0 0; display: flex; flex-direction: column; }
  html[data-layout="horizontal"] #text { position: static; height: calc(42px * var(--k)); flex-shrink: 0; margin: calc(10px * var(--k)) 0 0; justify-content: center; }
  html[data-layout="horizontal"] #title { height: calc(24px * var(--k)); line-height: calc(24px * var(--k)); font-size: calc(20px * var(--k)); font-family: var(--title-font); }
  html[data-layout="horizontal"] #artist { height: calc(18px * var(--k)); line-height: calc(18px * var(--k)); opacity: .85; }
  html[data-layout="horizontal"] #title, html[data-layout="horizontal"] #artist { unicode-bidi: plaintext; }
  html[data-layout="horizontal"] #bottom { display: flex; align-items: center; justify-content: var(--align); gap: calc(6px * var(--k)); height: calc(14px * var(--k)); flex-shrink: 0; margin: calc(4px * var(--k)) 0 calc(10px * var(--k)); }
  html[data-layout="horizontal"] #elapsed, html[data-layout="horizontal"] #duration { flex: 0 0 calc(44px * var(--k)); width: calc(44px * var(--k)); line-height: calc(14px * var(--k)); }
  html[data-layout="horizontal"] #bar { flex: 1; height: calc(4px * var(--k)); border-radius: calc(2px * var(--k)); background: rgba(255,255,255,.25); }
  html[data-layout="horizontal"][data-show-art="false"] #cover { display: none; }
  html[data-layout="horizontal"][data-show-art="false"] #column { margin: 0 calc(12px * var(--k)); }
  html[data-layout="horizontal"][data-show-progress="false"] #bottom { display: none; }
  html[data-layout="horizontal"][data-show-progress="false"] #text { height: 100%; margin: 0; }
  html[data-layout="horizontal"][data-has-time="false"] #elapsed, html[data-layout="horizontal"][data-has-time="false"] #duration { display: none; }

  html[data-theme="matte"] #colour, html[data-theme="matte-light"] #colour { display: none; }
  html[data-theme="matte"] #stripe, html[data-theme="matte-light"] #stripe { display: block; position: absolute; left: 0; top: 0; width: calc(4px * var(--k)); height: 100%; background: var(--accent); }
  html[data-theme="matte-light"] #artist { opacity: .7; }
  html[data-theme="matte-light"] #bar { background: rgba(0,0,0,.18); }
  html[data-theme="standard"] #barfill, html[data-theme="classic"] #barfill, html[data-theme="simple"] #barfill { background: #fff; }
  html[data-theme="standard"][data-colours="custom"] #colour, html[data-theme="classic"][data-colours="custom"] #colour { display: none; }
  html[data-theme="standard"][data-colours="custom"] #barfill, html[data-theme="classic"][data-colours="custom"] #barfill, html[data-theme="simple"][data-colours="custom"] #barfill { background: var(--accent); }

  html[data-theme="classic"] #pill { overflow: visible; border-radius: 0; box-shadow: none; }
  html[data-theme="classic"] #cover { flex: 0 0 calc(80px * var(--k)); width: calc(80px * var(--k)); height: calc(80px * var(--k)); margin: 0; border-radius: calc(10px * var(--k)); box-shadow: 0 4px 10px rgba(0,0,0,.6); }
  html[data-theme="classic"] #column { margin: 0 calc(12px * var(--k)) 0 calc(22px * var(--k)); }
  html[data-theme="classic"] #panel, html[data-theme="classic"] #colour { left: calc(90px * var(--k)); width: calc(var(--w) - 90px * var(--k)); border-radius: calc(14px * var(--k)); }
  html[data-theme="classic"] #panel { box-shadow: 6px 8px 14px rgba(0,0,0,.65); opacity: 1; background: transparent; }
  html[data-theme="classic"] #surface { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: inherit; background: var(--bg); opacity: var(--bg-a); }
  html[data-theme="classic"] #barhead { display: block; background: #fff; }
  html[data-theme="classic"][data-colours="custom"] #barhead { background: var(--accent); }
  html[data-theme="classic"][data-show-art="false"] #panel, html[data-theme="classic"][data-show-art="false"] #colour { left: 0; width: 100%; }

  html[data-theme="simple"] #pill { overflow: visible; border-radius: 0; box-shadow: none; }
  html[data-theme="simple"] #panel, html[data-theme="simple"] #colour { display: none; }
  html[data-theme="simple"] #cover { flex: 0 0 calc(72px * var(--k)); width: calc(72px * var(--k)); height: calc(72px * var(--k)); margin: 0 calc(16px * var(--k)) 0 0; border-radius: calc(10px * var(--k)); box-shadow: 0 4px 10px rgba(0,0,0,.6); }
  html[data-theme="simple"] #column { margin: 0; }
  html[data-theme="simple"][data-show-art="false"] #column { margin: 0 0 0 calc(12px * var(--k)); }
  html[data-theme="simple"] #text { height: calc(44px * var(--k)); margin: calc(6px * var(--k)) 0 0; }
  html[data-theme="simple"] #title { font-size: calc(21px * var(--k)); height: calc(26px * var(--k)); line-height: calc(26px * var(--k)); }
  html[data-theme="simple"] #artist { opacity: .9; }
  html[data-theme="simple"] #bottom { margin: calc(6px * var(--k)) 0 calc(10px * var(--k)); }
  html[data-theme="simple"] #bar { height: calc(3px * var(--k)); border-radius: calc(1.5px * var(--k)); background: rgba(0,0,0,.4); transform: translateY(calc(.5px * var(--k))); }
  html[data-theme="simple"][data-show-progress="false"] #text { height: 100%; margin: 0; }

  /* Album art: square cover, static scrim, independently bottom-anchored text and bar. */
  html[data-theme="album-art"] #pill { height: var(--h); border-radius: calc(12px * var(--k)); background: #2a2a2e; }
  html[data-theme="album-art"] #colour, html[data-theme="album-art"] #clip { display: none; }
  html[data-theme="album-art"] #cover { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #2a2a2e; }
  html[data-theme="album-art"] #panel { display: none; }
  html[data-theme="album-art"] #scrim { display: block; position: absolute; left: 0; bottom: 0; width: 100%; height: 44%; background: linear-gradient(180deg, rgba(0,0,0,0), var(--bg)); opacity: var(--bg-a); }
  html[data-theme="album-art"][data-colours="custom"] #pill { background: var(--bg); }
  html[data-theme="album-art"][data-show-art="false"] #cover { display: none; }
  html[data-theme="album-art"] #text { left: calc(12px * var(--k)); right: calc(12px * var(--k)); top: auto; bottom: calc(18px * var(--k)); }
  html[data-theme="album-art"] #title { height: calc(24px * var(--k)); line-height: calc(24px * var(--k)); font-family: var(--title-font); unicode-bidi: plaintext; }
  html[data-theme="album-art"] #artist { height: calc(18px * var(--k)); line-height: calc(18px * var(--k)); font-size: calc(14px * var(--k)); opacity: .85; unicode-bidi: plaintext; }
  html[data-theme="album-art"] #bottom { display: block; position: absolute; left: calc(12px * var(--k)); right: calc(12px * var(--k)); bottom: calc(7px * var(--k)); height: calc(3px * var(--k)); }
  html[data-theme="album-art"] #bar { width: 100%; height: 100%; border-radius: calc(1.5px * var(--k)); background: rgba(255,255,255,.3); }
  html[data-theme="album-art"] #barfill { background: #fff; }
  html[data-theme="album-art"][data-colours="custom"] #barfill { background: var(--accent); }
  html[data-theme="album-art"] #elapsed, html[data-theme="album-art"] #duration { display: none; }
  html[data-theme="album-art"][data-state="paused"] #status { display: block; }
  html[data-theme="album-art"][data-show-progress="false"] #bottom { display: none; }
  html[data-theme="album-art"][data-show-progress="false"] #text { top: 0; bottom: 0; }

  /* Card: fixed flow rows, with height determined only by the supported parts. */
  html[data-theme="card"] #pill { display: flex; flex-direction: column; height: var(--h); border-radius: calc(16px * var(--k)); background: transparent; }
  html[data-theme="card"] #panel { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--bg); opacity: var(--bg-a); }
  html[data-theme="card"] #colour { width: 100%; height: 100%; }
  html[data-theme="card"] #clip { display: none; }
  html[data-theme="card"][data-colours="custom"] #colour { display: none; }
  html[data-theme="card"] #cover { display: block; position: relative; width: calc(var(--w) - 32px * var(--k)); height: calc(var(--w) - 32px * var(--k)); flex-shrink: 0; margin: calc(16px * var(--k)) calc(16px * var(--k)) 0; border-radius: calc(8px * var(--k)); overflow: hidden; background: #2a2a2e; }
  html[data-theme="card"] #column { position: relative; display: flex; flex-direction: column; height: var(--th); margin: 0 calc(16px * var(--k)); flex-shrink: 0; min-width: 0; }
  html[data-theme="card"] #text { position: static; height: var(--text-h); margin: calc(12px * var(--k)) 0 0; flex-shrink: 0; }
  html[data-theme="card"] #title { height: calc(26px * var(--k)); line-height: calc(26px * var(--k)); font-size: calc(20px * var(--k)); font-family: var(--title-font); unicode-bidi: plaintext; }
  html[data-theme="card"] #artist { height: calc(20px * var(--k)); line-height: calc(20px * var(--k)); opacity: .85; unicode-bidi: plaintext; }
  html[data-theme="card"] #bottom { display: block; position: relative; height: calc(28px * var(--k)); margin: calc(10px * var(--k)) 0 0; flex-shrink: 0; }
  html[data-theme="card"] #bar { width: 100%; height: calc(4px * var(--k)); border-radius: calc(2px * var(--k)); background: rgba(255,255,255,.25); }
  html[data-theme="card"] #barfill { background: #fff; }
  html[data-theme="card"][data-colours="custom"] #barfill { background: var(--accent); }
  html[data-theme="card"] #elapsed, html[data-theme="card"] #duration { position: absolute; top: calc(8px * var(--k)); line-height: calc(16px * var(--k)); }
  html[data-theme="card"] #elapsed { left: 0; width: calc(44px * var(--k)); }
  html[data-theme="card"] #duration { right: 0; }
  html[data-theme="card"][data-has-time="false"] #elapsed, html[data-theme="card"][data-has-time="false"] #duration { display: none; }
  html[data-theme="card"][data-show-times="false"] #bottom { height: calc(4px * var(--k)); }
  html[data-theme="card"][data-show-art="false"] #cover { display: none; }
  html[data-theme="card"][data-show-art="false"] #column { margin: calc(16px * var(--k)) calc(16px * var(--k)) 0; }
  html[data-theme="card"][data-show-progress="false"] #bottom { display: none; }
  html[data-theme="card"][data-show-progress="false"] #column { justify-content: center; }
  html[data-theme="card"][data-show-progress="false"] #text { margin: 0; }
</style>
<script src="/overlay.js" defer></script>
</head>
<body>
<div id="backdrop"></div>
<div id="pill">
  <div id="panel"><div id="surface"></div></div>
  <canvas id="colour" width="400" height="56"></canvas>
  <div id="clip"><canvas id="grey" width="400" height="56"></canvas></div>
  <div id="stripe"></div>
  <div id="cover"><img id="thumb" alt=""><div id="noart" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="currentColor" d="M22 4v18a5 5 0 1 1-3-4.6V10l-9 3v12a5 5 0 1 1-3-4.6V10z"/></svg></div><div id="scrim"></div></div>
  <div id="column">
    <div id="text"><div id="title"></div><div id="artist"></div></div>
    <div id="bottom"><div id="elapsed"></div><div id="bar"><div id="barclip"><div id="barfill"></div></div><div id="barhead"></div></div><div id="duration"></div></div>
  </div>
  <svg id="status" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="0" width="3" height="12" rx="1" fill="currentColor"/><rect x="8" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
</div>
</body>
</html>
