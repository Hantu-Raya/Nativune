# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Nativune.Nativune
PackageVersion: {{VERSION}}
MinimumOSVersion: 10.0.19041.0
InstallerType: exe
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: --silent --no-launch --install-prerequisites
  SilentWithProgress: --silent --no-launch --install-prerequisites
ExpectedReturnCodes:
- InstallerReturnCode: 2
  ReturnResponse: invalidParameter
- InstallerReturnCode: 3
  ReturnResponse: cancelledByUser
- InstallerReturnCode: 13
  ReturnResponse: installInProgress
- InstallerReturnCode: 18
  ReturnResponse: systemNotSupported
- InstallerReturnCode: 19
  ReturnResponse: missingDependency
UpgradeBehavior: install
ProductCode: Nativune
ReleaseDate: {{RELEASE_DATE}}
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Microsoft.VCRedist.2015+.x64
  - PackageIdentifier: Microsoft.DotNet.Runtime.10
    MinimumVersion: 10.0.0
  - PackageIdentifier: Microsoft.EdgeWebView2Runtime
    MinimumVersion: 152.0.4191.53
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/Hantu-Raya/Nativune/releases/download/v{{VERSION}}/Nativune-Setup.exe
  InstallerSha256: {{SETUP_SHA256}}
ManifestType: installer
ManifestVersion: 1.12.0
