name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [non-goals in CONTRIBUTING](https://github.com/Hantu-Raya/Nativune/blob/main/CONTRIBUTING.md#ground-rules) first: features such as downloading media or blocking ads by default won't be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional.
